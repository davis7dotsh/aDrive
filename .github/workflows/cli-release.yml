name: CLI release

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: write

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # contents: write is only for the release step; package scripts
          # must not see a persisted token.
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore toolchain exec bits
        # @effect/tsgo's platform packages ship lib/tsc without the exec
        # bit on Linux (it isn't a package "bin", so pnpm doesn't restore
        # the mode). effect-tsgo spawns it directly, so chmod before checks.
        run: find node_modules/.pnpm -path '*/@effect/tsgo-*/lib/tsc' -exec chmod +x {} +

      - name: Full gate
        run: |
          pnpm format:check
          pnpm check
          pnpm test

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#cli-v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag $TAG does not contain a valid semver" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build bundle
        working-directory: packages/cli
        env:
          ADRIVE_CLI_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm build

      - name: Smoke the bundle
        working-directory: packages/cli
        run: |
          REPORTED="$(node dist/adrive.mjs --version)"
          echo "bundle reports: $REPORTED"
          if [ "$REPORTED" != "adrive v${{ steps.version.outputs.version }}" ]; then
            echo "Bundle version does not match the tag" >&2
            exit 1
          fi
          # Run the full contract suite against the built artifact.
          ADRIVE_TEST_BUNDLE="$PWD/dist/adrive.mjs" pnpm test

      - name: Checksums
        working-directory: packages/cli/dist
        run: |
          cp ../../../scripts/install-cli.sh .
          sha256sum adrive.mjs install-cli.sh > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: adrive CLI ${{ steps.version.outputs.version }}
          files: |
            packages/cli/dist/adrive.mjs
            packages/cli/dist/install-cli.sh
            packages/cli/dist/checksums.txt
          body: |
            Single-file build of the adrive CLI (requires Node >= 20).

            Install or update:

            ```
            curl -fsSL https://raw.githubusercontent.com/davis7dotsh/aDrive/main/scripts/install-cli.sh | bash
            ```

            Already installed? `adrive upgrade` gets you here too.

            Assets are SHA-256 verified by the installer via `checksums.txt`.
