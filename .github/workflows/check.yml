name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: adrive
          POSTGRES_PASSWORD: adrive
          POSTGRES_DB: adrive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U adrive -d adrive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - name: Configure local test services
        run: cp apps/web/.dev.vars.example apps/web/.dev.vars
      - run: bun run format:check
      - run: bun run check
      - run: bun run test
      - name: Build Worker
        working-directory: apps/web
        run: bun x vite build
